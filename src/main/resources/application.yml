spring:
  application:
    name: walletcore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/walletcore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info