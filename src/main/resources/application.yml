spring:
  application:
    name: walletcore

  datasource:
    url: jdbc:postgresql://localhost:5432/walletcore
    username: walletcore
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    schemas: public
    default-schema: public

  logging:
    level:
      org.springframework.security: DEBUG

    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000
server:
  port: 8080
